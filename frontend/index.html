<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }

        .add-btn {
            background-color: #198754;
            color: white;
            width: 100%;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .edit-btn {
            background-color: #0d6efd;
            color: white;
            margin-left: 8px;
        }

        .student {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .student:last-child {
            border-bottom: none;
        }

        .student p {
            margin: 6px 0;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <div class="card">

        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="text"
                id="department"
                placeholder="Department"
                required
            >

            <input
                type="number"
                id="age"
                placeholder="Age"
                required
            >

            <button type="submit" class="add-btn" id="submitBtn">
                Add Student
            </button>

        </form>

        <div id="message"></div>

    </div>


    <div class="card">

        <h2>Student List</h2>

        <div id="studentList">
            Loading students...
        </div>

    </div>

</div>


<script>

    // LIVE RENDER BACKEND API
    const API_URL =
        "https://django-student-management-system-1-xzpc.onrender.com/api/students/";

    let editingStudentId = null;


    // GET - Load all students
    function loadStudents() {

        fetch(API_URL)
            .then(response => {

                if (!response.ok) {
                    throw new Error("Unable to load students");
                }

                return response.json();

            })
            .then(data => {

                const studentList =
                    document.getElementById("studentList");

                studentList.innerHTML = "";

                if (data.length === 0) {

                    studentList.innerHTML =
                        "<p>No students found.</p>";

                    return;
                }


                data.forEach(student => {

                    const studentDiv =
                        document.createElement("div");

                    studentDiv.className = "student";


                    studentDiv.innerHTML = `
                        <p><strong>Name:</strong> ${student.name}</p>

                        <p><strong>Email:</strong> ${student.email}</p>

                        <p><strong>Department:</strong> ${student.department}</p>

                        <p><strong>Age:</strong> ${student.age}</p>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})">
                            Delete
                        </button>

                        <button
                            class="edit-btn"
                            onclick="editStudent(
                                ${student.id},
                                '${student.name}',
                                '${student.email}',
                                '${student.department}',
                                ${student.age}
                            )">
                            Edit
                        </button>
                    `;


                    studentList.appendChild(studentDiv);

                });

            })

            .catch(error => {

                console.error(error);

                document.getElementById("studentList").innerHTML =
                    "<p>Unable to load students.</p>";

            });

    }



    // ADD / UPDATE student
    document
        .getElementById("studentForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const student = {

                name:
                    document.getElementById("name").value,

                email:
                    document.getElementById("email").value,

                department:
                    document.getElementById("department").value,

                age:
                    document.getElementById("age").value

            };


            // UPDATE
            if (editingStudentId !== null) {

                fetch(API_URL + editingStudentId + "/", {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(student)

                })

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Student could not be updated");
                    }

                    return response.json();

                })

                .then(data => {

                    document.getElementById("message").innerText =
                        "Student updated successfully!";

                    resetForm();

                    loadStudents();

                })

                .catch(error => {

                    console.error(error);

                    document.getElementById("message").innerText =
                        "Error updating student.";

                });

                return;
            }


            // ADD
            fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(student)

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Student could not be added");
                }

                return response.json();

            })

            .then(data => {

                document.getElementById("message").innerText =
                    "Student added successfully!";

                resetForm();

                loadStudents();

            })

            .catch(error => {

                console.error(error);

                document.getElementById("message").innerText =
                    "Error adding student.";

            });

        });



    // EDIT student
    function editStudent(id, name, email, department, age) {

        editingStudentId = id;

        document.getElementById("formTitle").innerText =
            "Edit Student";

        document.getElementById("submitBtn").innerText =
            "Update Student";

        document.getElementById("name").value =
            name;

        document.getElementById("email").value =
            email;

        document.getElementById("department").value =
            department;

        document.getElementById("age").value =
            age;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }



    // DELETE student
    function deleteStudent(id) {

        const confirmDelete =
            confirm("Are you sure you want to delete this student?");


        if (!confirmDelete) {
            return;
        }


        fetch(API_URL + id + "/", {

            method: "DELETE"

        })

        .then(response => {

            if (!response.ok) {
                throw new Error("Student could not be deleted");
            }

            loadStudents();

        })

        .catch(error => {

            console.error(error);

            alert("Error deleting student.");

        });

    }



    // Reset form
    function resetForm() {

        document.getElementById("studentForm").reset();

        editingStudentId = null;

        document.getElementById("formTitle").innerText =
            "Add Student";

        document.getElementById("submitBtn").innerText =
            "Add Student";

    }



    // Load students when page opens
    loadStudents();

</script>

</body>
</html>
